
name: Monitor XAUUSD

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
    

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar oro y enviar informe
        env:
          API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          api_key = os.environ["API_KEY"]
          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          def consultar(intervalo):
              params = urllib.parse.urlencode({
                  "symbol": "XAU/USD",
                  "interval": intervalo,
                  "outputsize": 60,
                  "apikey": api_key
              })
              url = "https://api.twelvedata.com/time_series?" + params
              with urllib.request.urlopen(url, timeout=25) as r:
                  data = json.load(r)
              if data.get("status") == "error":
                  raise RuntimeError(data.get("message", "Error de API"))
              velas = data.get("values", [])
              if len(velas) < 50:
                  raise RuntimeError("No hay suficientes velas")
              cierres = [float(v["close"]) for v in reversed(velas)]
              return cierres

          def ema(valores, periodo):
              promedio = sum(valores[:periodo]) / periodo
              k = 2 / (periodo + 1)
              for valor in valores[periodo:]:
                  promedio = valor * k + promedio * (1 - k)
              return promedio

          def analizar(intervalo):
              cierres = consultar(intervalo)
              e20 = ema(cierres, 20)
              e50 = ema(cierres, 50)
              precio = cierres[-1]
              if precio > e20 > e50:
                  tendencia = "Alcista"
              elif precio < e20 < e50:
                  tendencia = "Bajista"
              else:
                  tendencia = "Mixta"
              return precio, tendencia, e20, e50

          mensajes = ["MONITOR XAUUSD - PRUEBA"]
          mensajes.append("Hora UTC: " + datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M"))

          for intervalo in ["5min", "15min"]:
              try:
                  precio, tendencia, e20, e50 = analizar(intervalo)
                  mensajes.append(
                      f"{intervalo}: {tendencia}\n"
                      f"Precio: {precio:.2f}\n"
                      f"EMA20: {e20:.2f} | EMA50: {e50:.2f}"
                  )
              except Exception as e:
                  mensajes.append(f"{intervalo}: sin datos - {str(e)[:160]}")

          mensajes.append("Informe educativo. No es una señal de entrada.")
          texto = "\n\n".join(mensajes)

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": texto
          }).encode()

          req = urllib.request.Request(url, data=payload)
          with urllib.request.urlopen(req, timeout=25) as r:
              respuesta = json.load(r)
          if not respuesta.get("ok"):
              raise RuntimeError("Telegram no confirmó el envío")
          print("Informe enviado correctamente")
          PY
